services:
  mailhot:
    container_name: mailhot
    restart: unless-stopped
    image: mailhog/mailhog@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    ports:
      - 1025:1025 # smtp server
      - 8025:8025 # web ui
    networks:
      - gains-network

  gains:
    image: gains
    container_name: gains
    restart: unless-stopped
    build:
      context: ./
      dockerfile: ./Dockerfile.dev
    stdin_open: true
    ports:
      - ${PORT}:${PORT}
      - ${VUE_PORT}:${VUE_PORT}
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - gains-network
    depends_on:
      mailhot:
        condition: service_started

networks:
  gains-network:
    driver: bridge
